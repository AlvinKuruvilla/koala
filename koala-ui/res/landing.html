<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light">
<title>New Tab</title>
<style>
  /* light-dark() below picks its value from the used color-scheme, so
     switching themes is one property on the root. */
  :root {
    color-scheme: light;

    --green: oklch(0.56 0.08 160);
    --green-soft: oklch(0.56 0.08 160 / 0.14);

    --bg: light-dark(oklch(0.985 0.004 160), oklch(0.18 0.01 160));
    --surface: light-dark(oklch(1 0 0 / 0.72), oklch(0.26 0.01 160 / 0.72));
    --surface-hover: light-dark(oklch(1 0 0), oklch(0.31 0.012 160));
    --border: light-dark(oklch(0.2 0.02 160 / 0.08), oklch(1 0 0 / 0.08));
    --text: light-dark(oklch(0.24 0.015 160), oklch(0.94 0.005 160));
    --text-muted: light-dark(oklch(0.5 0.015 160), oklch(0.7 0.01 160));

    --radius: 16px;
    --shadow: 0 1px 2px oklch(0 0 0 / 0.06), 0 8px 24px oklch(0 0 0 / 0.06);
  }

  :root[data-theme="dark"] {
    color-scheme: dark;
  }

  *, *::before, *::after { box-sizing: border-box; }

  body {
    margin: 0;
    min-height: 100dvh;
    display: grid;
    place-items: center;
    padding: clamp(24px, 6vh, 64px) 24px;
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    color: var(--text);
    background:
      radial-gradient(60rem 40rem at 50% -10%, var(--green-soft), transparent 70%),
      var(--bg);
    -webkit-font-smoothing: antialiased;
  }

  main {
    width: min(100%, 720px);
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: clamp(28px, 5vh, 44px);
  }

  .logo {
    width: clamp(72px, 10vw, 96px);
    aspect-ratio: 1;
    filter: drop-shadow(0 10px 24px oklch(0.4 0.08 160 / 0.3));
  }

  .search {
    width: 100%;
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 16px 20px;
    border: 1px solid var(--border);
    border-radius: 999px;
    background: var(--surface);
    backdrop-filter: blur(20px) saturate(1.4);
    box-shadow: var(--shadow);
    color: var(--text-muted);
    font-size: 1rem;
  }

  .search svg {
    flex: none;
    width: 20px;
    height: 20px;
  }

  .search span { flex: 1; }

  kbd {
    padding: 2px 8px;
    border: 1px solid var(--border);
    border-radius: 6px;
    font: 500 0.8125rem/1.5 ui-monospace, "SF Mono", monospace;
    color: var(--text-muted);
  }

  .sites {
    width: 100%;
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(104px, 1fr));
    gap: 12px;
    margin: 0;
    padding: 0;
    list-style: none;
  }

  .sites a {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 10px;
    padding: 16px 8px 12px;
    border-radius: var(--radius);
    color: inherit;
    text-decoration: none;
    font-size: 0.8125rem;
    transition: background-color 150ms ease, transform 150ms ease;
  }

  .sites a:hover {
    background: var(--surface-hover);
    transform: translateY(-2px);
  }

  .sites a:focus-visible {
    outline: 2px solid var(--green);
    outline-offset: 2px;
  }

  .tile {
    width: 48px;
    aspect-ratio: 1;
    display: grid;
    place-items: center;
    border: 1px solid var(--border);
    border-radius: 14px;
    background: var(--surface);
    box-shadow: var(--shadow);
    color: var(--text);
  }

  .tile svg {
    width: 24px;
    height: 24px;
  }

  .name {
    max-width: 100%;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }

  .theme-toggle {
    position: fixed;
    top: 16px;
    right: 16px;
    display: grid;
    place-items: center;
    width: 40px;
    height: 40px;
    padding: 0;
    border: 1px solid var(--border);
    border-radius: 999px;
    background: var(--surface);
    backdrop-filter: blur(20px);
    box-shadow: var(--shadow);
    color: var(--text-muted);
    cursor: pointer;
    transition: color 150ms ease, background-color 150ms ease;
  }

  .theme-toggle:hover {
    color: var(--text);
    background: var(--surface-hover);
  }

  .theme-toggle:focus-visible {
    outline: 2px solid var(--green);
    outline-offset: 2px;
  }

  .theme-toggle svg {
    width: 18px;
    height: 18px;
  }

  /* Show the icon for the theme a click switches to. */
  :root[data-theme="dark"] .icon-moon,
  :root:not([data-theme="dark"]) .icon-sun {
    display: none;
  }

  @media (prefers-reduced-motion: reduce) {
    .sites a { transition: none; }
    .sites a:hover { transform: none; }
  }
</style>

  <script>
    // The choice is remembered per browser profile. Storage can be
    // unavailable (private windows, a browser without it), in which case
    // the page stays light and the toggle still works for this visit.
    const root = document.documentElement;
    const toggle = document.querySelector(".theme-toggle");

    function applyTheme(theme) {
      root.dataset.theme = theme;
      toggle.setAttribute(
        "aria-label",
        theme === "dark" ? "Switch to light theme" : "Switch to dark theme",
      );
    }

    try {
      applyTheme(localStorage.getItem("koala-theme") ?? "light");
    } catch {
      applyTheme("light");
    }

    toggle.addEventListener("click", () => {
      const next = root.dataset.theme === "dark" ? "light" : "dark";
      applyTheme(next);
      try {
        localStorage.setItem("koala-theme", next);
      } catch {}
    });
  </script>
