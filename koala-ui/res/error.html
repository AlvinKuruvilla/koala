<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>{{title}}</title>
<style>
  html { background: #ffffff; }
  body {
    margin: 0;
    color: #202124;
    font-family: Helvetica, Arial, sans-serif;
    font-size: 15px;
    line-height: 1.55;
  }
  main {
    max-width: 600px;
    margin: 0 auto;
    padding: 18vh 24px 48px;
  }
  h1 {
    margin: 0 0 16px;
    font-size: 24px;
    font-weight: normal;
    line-height: 1.25;
  }
  p { margin: 0 0 16px; color: #5f6368; }
  strong { color: #202124; }
  ul { margin: 0 0 24px; padding-left: 20px; color: #5f6368; }
  li { margin-bottom: 4px; }
  .code {
    margin: 0 0 4px;
    color: #5f6368;
    font-size: 12px;
    letter-spacing: 0.5px;
  }
  .detail {
    margin: 0;
    color: #80868b;
    font-size: 12px;
  }
</style>
</head>
<body>
<main>
  <h1>{{heading}}</h1>
  <p>{{summary}}</p>
  {{suggestions}}
  <p class="code">{{code}}</p>
  <p class="detail">{{detail}}</p>
</main>
</body>
</html>
