[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "koala-lab"
version = "0.1.0"
description = "Measure koala builds against each other and report what changed"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "Alvin Kuruvilla", email = "alvineasokuruvilla@gmail.com" },
]
dependencies = [
    "rich>=15.0.0",
    "scipy>=1.17.1",
]

[project.scripts]
koala-lab = "koala_lab.main:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "hypothesis>=6",
    "syrupy>=4",
    "ruff>=0.9",
    "mypy>=1.13",
    "scipy-stubs>=1.17.1.5",
]

[tool.hatch.build.targets.wheel]
packages = ["src/koala_lab"]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = [
    "E", "W",   # pycodestyle
    "F",        # pyflakes
    "I",        # isort
    "B",        # flake8-bugbear
    "C4",       # flake8-comprehensions
    "UP",       # pyupgrade
    "SIM",      # flake8-simplify
    "PTH",      # flake8-use-pathlib (prefer pathlib.Path)
    "RUF",      # ruff-specific
]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]

[tool.ruff.lint.isort]
known-first-party = ["koala_lab"]

[tool.mypy]
python_version = "3.11"
strict = true

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false

[tool.pytest.ini_options]
minversion = "8.0"
addopts = "-ra -q --strict-markers --strict-config"
testpaths = ["tests"]

[tool.coverage.run]
source = ["src"]
branch = true
