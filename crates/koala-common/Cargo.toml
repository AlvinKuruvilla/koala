[package]
name = "koala-common"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Shared utilities for the Koala renderer"

[dependencies]
backtrace = { version = "0.3.76", optional = true }
base64 = "0.22.1"
hex = "0.4.3"
koala-std.workspace = true
reqwest.workspace = true
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
sha2 = "0.11.0"
thiserror.workspace = true
url = "2.5.8"

[lints]
workspace = true

[features]
# Opt-in call-site attribution for small allocations (see
# `alloc_count::attribution`). Pulls in `backtrace` for stack capture and
# symbolization; off by default so normal builds never link it.
alloc-attribution = ["dep:backtrace"]
