[package]
name = "koala-css"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "CSS tokenizer, parser, layout engine, and cascade for the Koala renderer"

[dependencies]
koala-common.workspace = true
koala-dom.workspace = true
koala-fetch.workspace = true
# `std` feature provides `FlyString`, used as the key type for the
# cascade's custom-property map.
koala-std = { workspace = true, features = ["std"] }
serde.workspace = true

[features]
layout-trace = []

[dev-dependencies]
koala-html.workspace = true

[lints]
workspace = true
